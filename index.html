<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACADI — Free parent classroom, printables & resources</title>
<meta name="description" content="ACADI is a free educational and support platform for parents and caregivers of children with special needs, ages 2–15, starting in Lebanon.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--plum:#5E2A63;--plum-deep:#3A1A40;--ink:#2B1B33;--muted:#6E5B78;--line:rgba(94,42,99,.12);
--lavender:#E6DDF7;--mint:#D6F2E4;--blush:#FBE0EA;--sky:#DCEBFA;--cream:#FFF8F1;--sun:#FFF1D6;--star:#F4B942;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:'IBM Plex Sans Arabic',Inter,sans-serif}
img,video{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
input,textarea,select{font:inherit;color:var(--ink);background:#fff}
.anton{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase}
html[dir=rtl] .anton{font-family:'IBM Plex Sans Arabic',Anton,sans-serif;font-weight:700;letter-spacing:0}
.wrap{width:min(1240px,94vw);margin-inline:auto}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.hidden{display:none!important}

/* nav */
.nav{position:sticky;top:0;z-index:40;background:rgba(255,248,241,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:14px}
.nav .logo{flex:0 0 auto;display:block}.nav .logo img{height:40px;width:auto;max-width:none}
@media(max-width:600px){.nav .logo img{height:32px}.nav .wrap{gap:8px}}
.nav ul{display:flex;gap:18px;list-style:none;font-weight:600;font-size:14px}
.nav ul a{opacity:.8;transition:opacity .3s;white-space:nowrap;padding:6px 0;border-bottom:2px solid transparent}
.nav ul a:hover,.nav ul a.on{opacity:1;border-color:var(--plum)}
.nav ul a .soon{font-size:9px;background:var(--star);color:var(--plum-deep);border-radius:99px;padding:2px 6px;margin-inline-start:4px;vertical-align:middle;font-weight:800}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.lang button{border:0;background:transparent;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px;color:var(--plum)}
.lang button.on{background:var(--plum);color:#fff}
.gear{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--plum)}.gear svg{width:18px;height:18px}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;place-items:center;color:var(--plum)}
.burger svg{width:20px;height:20px}
.drawer{display:none;position:fixed;inset:72px 0 0 0;background:var(--cream);z-index:39;padding:20px 5vw;overflow:auto}
.drawer.open{display:block}
.drawer a{display:block;padding:16px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:18px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--plum);color:#fff;border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15px;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(94,42,99,.25)}
.btn.light{background:#fff;color:var(--plum);border:2px solid var(--line)}
.btn.sun{background:var(--star);color:var(--plum-deep)}
.btn.sm{padding:9px 14px;font-size:13px}
.btn.danger{background:#B3261E}
.free{display:inline-flex;align-items:center;gap:8px;background:var(--mint);color:#1F5C3F;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.free::before{content:"";width:8px;height:8px;border-radius:50%;background:#2E9E6B}
.chip{display:inline-block;background:rgba(255,255,255,.75);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--plum)}
@media(max-width:1080px){.nav ul{display:none}.nav .btn{display:none}.burger{display:grid}}

/* hero */
.hero{position:relative;background:var(--lavender);transition:background 1.1s var(--ease);overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:140px;background:linear-gradient(180deg,transparent,var(--cream));pointer-events:none}
.hero .stage{position:relative;height:calc(100svh - 72px);min-height:640px;max-height:920px}
.word{position:absolute;left:0;right:0;top:10%;text-align:center;line-height:.9;white-space:nowrap;pointer-events:none;user-select:none;color:var(--wc,#A98BD8);opacity:.72;z-index:0}
.cast,.copy,.arrows,.tabs,.floor{z-index:1}
.word span{display:inline-block}
.cast{position:absolute;inset:0}
.kid{position:absolute;bottom:0;left:50%;transform:translateX(-50%);will-change:transform,filter,opacity;pointer-events:none}
.kid img{height:min(76vh,740px);width:auto;max-width:none;filter:drop-shadow(0 30px 40px rgba(58,26,64,.25))}
.kid.side img{height:min(50vh,480px)}
.kid.side{opacity:.55;filter:blur(1.5px) saturate(.9)}
.kid.l{left:22%}.kid.r{left:78%}
.floor{position:absolute;left:50%;bottom:-6%;width:70vw;max-width:900px;height:22vw;max-height:260px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(94,42,99,.14),transparent 70%)}
.copy{position:absolute;inset-inline-start:0;bottom:9%;max-width:430px;z-index:3}
.copy .n{margin-top:16px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--plum)}
.copy h1{font-size:clamp(34px,4.2vw,58px);line-height:1.04;letter-spacing:-.02em;margin:8px 0 12px;font-weight:800}
.copy p{font-size:17px;color:var(--muted);font-weight:500;max-width:38ch}
.copy .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.arrows{position:absolute;inset-inline-start:0;bottom:calc(9% - 70px);z-index:3;display:flex;gap:10px}
.arrow{width:54px;height:54px;border-radius:50%;border:2px solid var(--plum);background:rgba(255,255,255,.4);color:var(--plum);display:grid;place-items:center;color:var(--plum);transition:all .35s var(--ease)}
.arrow:hover{background:var(--plum);color:#fff;transform:scale(1.06)}
.arrow svg{width:20px;height:20px}
html[dir=rtl] .arrow svg{transform:scaleX(-1)}
.tabs{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:4;display:flex;gap:6px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:8px}
.tab{border:0;background:transparent;color:var(--muted);border-radius:16px;padding:12px 18px;font-weight:700;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;transition:all .35s var(--ease)}
.tab b{font-weight:800;color:var(--plum);opacity:.6}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 8px 20px rgba(94,42,99,.1)}
@media(max-width:900px){
.hero .stage{min-height:0;height:auto;max-height:none;padding:0 0 24px}
.word{top:5vh}
.cast{position:relative;height:58vh;min-height:400px;margin-top:3vh}
.kid img{height:min(48vh,420px)}.kid.side{display:none}
.copy{position:relative;bottom:auto;max-width:none;margin-top:14px}.copy h1{font-size:clamp(30px,8vw,42px)}
.arrows{position:relative;bottom:auto;margin-top:18px}
.tabs{position:relative;left:auto;transform:none;margin:24px auto 0;border-radius:22px;border-bottom:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto}
.tab{padding:10px 12px;font-size:13px}.tab b{display:none}}

/* page banner (inner pages) */
.banner{background:var(--bc,var(--lavender));border-radius:0 0 40px 40px;padding:clamp(40px,6vw,80px) 0 clamp(36px,5vw,60px);position:relative;overflow:hidden}
.banner .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:end;position:relative;z-index:2}
.banner .bw{position:absolute;inset-inline-end:2%;top:-8%;font-size:clamp(80px,11vw,190px);line-height:1;color:var(--wc,#A98BD8);opacity:.6;pointer-events:none;white-space:nowrap}
.banner h1{font-size:clamp(34px,5vw,64px);line-height:1;letter-spacing:-.02em;font-weight:800;margin:12px 0 12px}
.banner .crumb{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--plum)}
.banner .crumb a{opacity:.7}
.banner .bart{position:relative;height:300px}
.banner .bart img{position:absolute;bottom:-60px;inset-inline-end:0;height:360px;filter:drop-shadow(0 24px 30px rgba(58,26,64,.25))}
@media(max-width:900px){.banner .wrap{grid-template-columns:1fr}.banner .bart{height:200px}.banner .bart img{height:250px;bottom:-50px}}

/* ticker */
.ticker{direction:ltr;overflow:hidden;border-block:1px solid var(--line);padding:16px 0;background:#fff}
.ticker .row{display:flex;gap:40px;white-space:nowrap;width:max-content}
.ticker .row span{font-size:26px;color:var(--plum);display:inline-flex;align-items:center;gap:40px}
.ticker .row span::after{content:"✦";color:var(--star);font-size:20px}

/* sections */
section{padding:clamp(64px,8vw,110px) 0}
.kick{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--plum);display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:28px;height:2px;background:var(--plum);border-radius:2px}
h2{font-size:clamp(32px,4.6vw,58px);line-height:1;letter-spacing:-.02em;font-weight:800;margin:14px 0 16px;max-width:18ch}
h2 .anton{display:block;color:var(--plum);font-size:1.18em;letter-spacing:.02em;font-weight:400}
html[dir=rtl] h2 .anton{font-weight:700;font-size:1em}
.sub{font-size:clamp(16px,1.3vw,19px);color:var(--muted);font-weight:500;max-width:58ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.empty{background:#fff;border:1px dashed var(--line);border-radius:22px;padding:28px;color:var(--muted);font-weight:600;text-align:center}

/* welcome */
.welcome .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.welcome h2{max-width:none}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pill{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;gap:14px;align-items:flex-start}
.pill .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;flex:0 0 64px;font-size:20px;padding:6px}.pill .ic img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(58,26,64,.18))}
.pill b{display:block;font-size:15px}.pill span{font-size:13px;color:var(--muted);font-weight:500}
@media(max-width:900px){.welcome .wrap{grid-template-columns:1fr}}

/* lesson cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.lesson{border-radius:28px;background:var(--c,var(--lavender));padding:24px;min-height:440px;position:relative;overflow:hidden;display:flex;flex-direction:column;transition:transform .5s var(--ease),box-shadow .5s var(--ease);color:var(--ink)}
.lesson:hover{transform:translateY(-8px);box-shadow:0 30px 60px rgba(94,42,99,.14)}
.lesson .meta{display:flex;gap:8px;flex-wrap:wrap}
.lesson h3{font-size:24px;line-height:1.1;letter-spacing:-.01em;font-weight:800;margin-top:14px;max-width:14ch;position:relative;z-index:2}
.lesson p{font-size:14px;color:var(--muted);font-weight:500;margin-top:8px;max-width:26ch;position:relative;z-index:2}
.lesson .steps{margin-top:auto;position:relative;z-index:2;display:flex;gap:6px;font-size:12px;font-weight:700;color:var(--plum);flex-wrap:wrap}
.lesson .steps i{font-style:normal;background:rgba(255,255,255,.8);border-radius:8px;padding:4px 8px}
.lesson img.kid-img{position:absolute;inset-inline-end:-4%;bottom:0;height:62%;width:auto;filter:drop-shadow(0 20px 26px rgba(58,26,64,.22));transition:transform .6s var(--ease)}
.lesson img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.lesson img.cover + .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.9) 40%,rgba(255,255,255,.4))}
.lesson:hover img.kid-img{transform:translateY(-6px) scale(1.03)}
.lesson .play{position:absolute;inset-inline-end:22px;top:22px;width:44px;height:44px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;z-index:3}
.lesson .play svg{width:16px;height:16px;margin-inline-start:2px}
.topics{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.topics span,.topics button{background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;color:var(--ink)}
.topics button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
@media(max-width:900px){.grid3{grid-template-columns:1fr}.lesson{min-height:400px}}

/* printables */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.print{border-radius:24px;padding:22px;background:#fff;border:1px solid var(--line);box-shadow:0 16px 36px rgba(94,42,99,.08);display:flex;gap:18px;align-items:center;transition:transform .4s var(--ease),border-color .3s;color:var(--ink)}
.print:hover{transform:translateY(-4px);border-color:var(--plum)}
.print .ic{width:86px;height:110px;border-radius:14px;background:var(--c,var(--lavender));flex:0 0 86px;position:relative;overflow:hidden}
.print .ic img{width:100%;height:100%;object-fit:cover}
.print .ic::before{content:"";position:absolute;left:12px;right:12px;top:14px;height:9px;border-radius:99px;background:rgba(255,255,255,.85)}
.print .ic.has::before{display:none}
.print h3{font-size:17px;font-weight:800}.print p{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.print .dl{margin-top:10px;font-size:13px;font-weight:800;color:var(--plum);display:inline-flex;gap:6px;align-items:center}
@media(max-width:900px){.pgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.pgrid{grid-template-columns:1fr}}

/* helps */
.helps{background:var(--plum-deep);color:#fff;border-radius:40px;padding:clamp(40px,6vw,80px) clamp(22px,5vw,64px)}
.helps .kick{color:#D9C7F0}.helps .kick::before{background:#D9C7F0}
.helps h2{color:#fff}.helps h2 .anton{color:var(--star)}.helps .sub{color:rgba(255,255,255,.75)}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.help{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:22px;min-height:300px;position:relative;overflow:hidden;transition:background .4s,transform .5s var(--ease);color:#fff}
.help:hover{background:rgba(255,255,255,.12);transform:translateY(-6px)}
.help .num{font-size:52px;color:rgba(255,255,255,.14);line-height:1}
.help h3{font-size:20px;font-weight:800;margin-top:6px;max-width:12ch;position:relative;z-index:2}
.help p{font-size:13.5px;color:rgba(255,255,255,.7);font-weight:500;margin-top:8px;max-width:22ch;position:relative;z-index:2}
.help img{position:absolute;inset-inline-end:-6%;bottom:-4%;height:70%;width:auto;filter:drop-shadow(0 20px 24px rgba(0,0,0,.35))}
@media(max-width:900px){.hgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.hgrid{grid-template-columns:1fr}}

/* articles */
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.art{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;min-height:240px;transition:transform .4s var(--ease),border-color .3s;color:var(--ink);overflow:hidden}
.art:hover{transform:translateY(-4px);border-color:var(--plum)}
.art .thumb{margin:-24px -24px 16px;height:150px;object-fit:cover;width:calc(100% + 48px);max-width:none}
.art .cat{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--plum)}
.art h3{font-size:20px;font-weight:800;margin-top:10px;line-height:1.2}.art p{font-size:14px;color:var(--muted);font-weight:500;margin-top:8px}
.art .src{margin-top:auto;padding-top:16px;font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.art .src::before{content:"↗";color:var(--plum)}
.disc{margin-top:24px;background:var(--sun);border-radius:18px;padding:16px 20px;font-size:14px;font-weight:600;color:#6B4A00;max-width:900px}
@media(max-width:900px){.agrid{grid-template-columns:1fr}}

/* detail page */
.detail{display:grid;grid-template-columns:1.4fr .6fr;gap:40px;align-items:start;margin-top:36px}
.body{font-size:17px;line-height:1.75;color:#3d2d46}
.body p{margin:0 0 18px}.body h3{font-size:24px;font-weight:800;margin:28px 0 10px}.body h4{font-size:18px;margin:22px 0 8px}
.body ul,.body ol{margin:0 0 18px 22px}html[dir=rtl] .body ul,html[dir=rtl] .body ol{margin:0 22px 18px 0}
.body li{margin-bottom:6px}
.media{border-radius:24px;overflow:hidden;background:#000;margin-bottom:24px}
.media video{width:100%;max-height:560px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:18px 0 26px}
.gallery img{border-radius:16px;aspect-ratio:1;object-fit:cover;width:100%}
.aside{display:grid;gap:14px;position:sticky;top:90px}
.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}
.box h4{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--plum);margin-bottom:12px}
.box .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;padding:8px 0;border-top:1px solid var(--line)}
.box .row:first-of-type{border-top:0}
.box a.file{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-weight:700;font-size:14px;color:var(--plum)}
.stepper{counter-reset:s;display:grid;gap:12px;margin:10px 0 24px}
.stepper div{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.stepper div::before{counter-increment:s;content:counter(s);font-family:Anton;font-size:22px;color:var(--plum);min-width:30px}
@media(max-width:900px){.detail{grid-template-columns:1fr}.aside{position:static}}

/* mission / support / forms */
.mission .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.mission img{filter:drop-shadow(0 30px 40px rgba(58,26,64,.2))}
form.f{display:grid;gap:10px;max-width:520px;margin-top:20px}
.f input,.f textarea,.f select{font-weight:600;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;width:100%}
.f textarea{min-height:90px;resize:vertical}
.f label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ok{display:none;margin-top:12px;font-weight:700;color:#1F5C3F}
.support .box2{background:var(--lavender);border-radius:36px;padding:clamp(36px,5vw,64px);display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;position:relative;overflow:hidden}
.support .box2 > div{position:relative;z-index:1}
.support .box2 .big{position:absolute;z-index:0;inset-inline-end:-2%;top:-10%;font-size:clamp(120px,20vw,280px);line-height:1;color:#fff;opacity:.5;pointer-events:none}
.support h2{max-width:none;font-size:clamp(28px,3.6vw,46px)}
.ways{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;position:relative;z-index:2}
.kidf{position:relative;height:340px;align-self:end}.kidf img{position:absolute;bottom:calc(-1 * clamp(36px,5vw,64px));left:50%;transform:translateX(-50%);height:400px;filter:drop-shadow(0 30px 40px rgba(58,26,64,.25))}
.quiet{margin-top:14px;font-size:13px;font-weight:600;color:var(--muted);position:relative;z-index:2}
@media(max-width:900px){.mission .wrap{grid-template-columns:1fr}.support .box2{grid-template-columns:1fr}.kidf{height:280px}.kidf img{height:330px}}

/* coming soon */
.soonbox{background:#fff;border:1px solid var(--line);border-radius:32px;padding:clamp(32px,5vw,60px);display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
.soonbox .tag{display:inline-block;background:var(--star);color:var(--plum-deep);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800}
.soonbox ul{margin:16px 0 0 20px;color:var(--muted);font-weight:600}html[dir=rtl] .soonbox ul{margin:16px 20px 0 0}
.pros{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.pro{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;gap:14px;align-items:center}
.pro .av{width:56px;height:56px;border-radius:18px;background:var(--lavender);display:grid;place-items:center;font-weight:800;color:var(--plum);overflow:hidden;flex:0 0 56px}
.pro .av img{width:100%;height:100%;object-fit:cover}
.pro b{display:block}.pro span{font-size:13px;color:var(--muted);font-weight:600}
@media(max-width:900px){.soonbox{grid-template-columns:1fr}.pros{grid-template-columns:1fr}}

footer{padding:36px 0 60px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;color:var(--muted);font-weight:600;font-size:14px;align-items:center}
footer img{height:30px}footer ul{display:flex;gap:16px;list-style:none;flex-wrap:wrap}
footer .adminlink{opacity:.5;font-size:12px}

/* ===== ADMIN ===== */
.admin{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 72px)}
.ad-side{background:var(--plum-deep);color:#fff;padding:24px 16px}
.ad-side h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin:18px 10px 8px}
.ad-side button{display:flex;width:100%;text-align:start;gap:10px;align-items:center;background:transparent;border:0;color:#fff;padding:11px 12px;border-radius:12px;font-weight:600;opacity:.8}
.ad-side button.on,.ad-side button:hover{background:rgba(255,255,255,.12);opacity:1}
.ad-side button .cnt{margin-inline-start:auto;background:rgba(255,255,255,.15);border-radius:99px;padding:2px 8px;font-size:12px}
.amain{padding:28px clamp(16px,3vw,40px);background:#FBF7F2}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.toolbar h2{margin:0;font-size:28px}
.table{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.trow{display:grid;grid-template-columns:56px 1fr 140px 110px 150px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.trow:first-child{border-top:0;background:var(--cream);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trow .th{width:48px;height:48px;border-radius:12px;background:var(--lavender);object-fit:cover}
.trow .st{font-size:11px;font-weight:800;border-radius:99px;padding:4px 10px;display:inline-block}
.st.pub{background:var(--mint);color:#1F5C3F}.st.draft{background:var(--sun);color:#6B4A00}
.trow .ops{display:flex;gap:6px;justify-content:flex-end}
.ibtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700}
.ibtn.red{color:#B3261E}
@media(max-width:900px){.admin{grid-template-columns:1fr}.ad-side{display:flex;flex-wrap:wrap;gap:4px;padding:10px}.ad-side h4{display:none}.ad-side button{width:auto;padding:8px 10px;font-size:13px}.trow{grid-template-columns:48px 1fr 90px;}.trow .hide-m{display:none}}
/* editor */
.editor{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;display:grid;grid-template-columns:1fr 320px;gap:24px}
.editor .col{display:grid;gap:14px;align-content:start}
.fld label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);font-weight:500;background:#fff}
.fld textarea{min-height:120px;resize:vertical}
.fld textarea.long{min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.langtabs{display:flex;gap:6px;margin-bottom:10px}
.langtabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:12px;color:var(--plum)}
.langtabs button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.lp{display:none}.lp.on{display:grid;gap:14px}
.up{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;background:var(--cream)}
.up input{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs .ad-t{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--lavender);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--plum);text-align:center;padding:4px}
.thumbs .ad-t img,.thumbs .ad-t video{width:100%;height:100%;object-fit:cover}
.thumbs .ad-t button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:#B3261E;color:#fff;font-size:12px;line-height:1}
.links{display:grid;gap:6px}
.links .lk{display:grid;grid-template-columns:1fr 1fr 32px;gap:6px}
.links .lk input{padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:13px}
.kids{display:flex;flex-wrap:wrap;gap:6px}
.kids img{width:46px;height:46px;object-fit:contain;border-radius:10px;background:var(--lavender);border:2px solid transparent;cursor:pointer}
.kids img.on{border-color:var(--plum)}
.notice{background:var(--sun);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;color:#6B4A00}
.notice.ok{background:var(--mint);color:#1F5C3F}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--plum-deep);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;z-index:99;display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
@media(max-width:900px){.editor{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}


/* shop */
.pgrid2{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;color:var(--ink);display:flex;flex-direction:column;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.pcard:hover{transform:translateY(-8px);box-shadow:0 30px 60px rgba(94,42,99,.14)}
.pimg{position:relative;aspect-ratio:1;background:var(--sun)}.pimg img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:14px;inset-inline-start:14px;background:var(--plum);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px}
.pbody{padding:18px 20px 22px}.pbody .cat{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--plum)}.pbody h3{font-size:20px;font-weight:800;margin-top:6px}.pbody p{font-size:14px;color:var(--muted);font-weight:500;margin-top:4px}
.prow{margin-top:12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.prow .price{font-size:22px;font-weight:800}.prow.big .price{font-size:34px}.prow .was{color:var(--muted);font-weight:600}.prow .off{background:var(--mint);color:#1F5C3F;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.pmain{border-radius:26px;overflow:hidden;background:var(--sun);aspect-ratio:1;margin-bottom:12px}.pmain img{width:100%;height:100%;object-fit:cover}
#pthumbs img{cursor:pointer;border:2px solid transparent}#pthumbs img:hover{border-color:var(--plum)}
@media(max-width:900px){.pgrid2{grid-template-columns:1fr 1fr}}@media(max-width:600px){.pgrid2{grid-template-columns:1fr}}
/* rich text editor */
.rte{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.rte .bar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-bottom:1px solid var(--line);background:var(--cream)}
.rte .bar button,.rte .bar select{width:auto;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;color:var(--ink);min-width:30px}
.rte .bar button:hover{border-color:var(--plum)}
.rte .bar input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:8px;padding:0;background:#fff}
.rte .ed{min-height:220px;padding:14px 16px;outline:0;font-size:15px;line-height:1.7}
.rte .ed:focus{box-shadow:inset 0 0 0 2px var(--lavender)}
.rte .ed img,.rte .ed video{max-width:100%;border-radius:12px;margin:8px 0}
.body img,.body video{max-width:100%;border-radius:18px;margin:14px 0}
.body a{color:var(--plum);text-decoration:underline}
.body blockquote{border-inline-start:4px solid var(--lavender);padding:8px 16px;margin:14px 0;color:var(--muted);font-style:italic}
[data-reveal]{opacity:0;transform:translateY(28px)}
.no-motion [data-reveal]{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){[data-reveal]{opacity:1;transform:none}.hero{transition:none}}

 lessons:[
  {id:'morning-routine',published:true,order:1,color:'lavender',kid:'s6_3',cat:'routines',ages:'3–8',duration:'6 min',title_en:'Teaching a morning routine with pictures',title_ar:'تعليم روتين الصباح بالصور',title_fr:'Enseigner une routine du matin en images',summary_en:'Why visual routines help, how to build a 4-step board, and what to do when a step is skipped.',summary_ar:'لماذا يساعد الروتين البصري، كيف تبني لوحة من ٤ خطوات، وماذا تفعل عند تخطّي خطوة.',summary_fr:'Pourquoi les routines visuelles aident, comment créer un tableau en 4 étapes.',why_en:'Many children find words fleeting and pictures steady. A visual schedule takes the instruction out of your voice and puts it on the wall, so the routine belongs to the child, not to a reminder.',steps_en:'Choose 4 steps for the morning (wake, toilet, dress, breakfast).\nPrint the cards and stick them on a strip at your child\'s eye level.\nWalk through it together once, pointing, not talking.\nLet your child move or flip each card when done.\nWhen a step is skipped, point at the board instead of repeating yourself.',videoUrl:'',videoAsset:'',images:[],files:[],links:[{t:'Visual schedule PDF',u:'#printables'}],sources_en:'Source references are added per article by the ACADI team.'},
  {id:'getting-dressed',published:true,order:2,color:'blush',kid:'s7_1',cat:'independence',ages:'4–10',duration:'5 min',title_en:'Getting dressed without the morning fight',title_ar:'ارتداء الملابس بدون معركة الصباح',title_fr:"S'habiller sans la bataille du matin",summary_en:'Breaking dressing into small wins, choosing clothes that feel okay, and a shoelace method that works.',summary_ar:'تقسيم اللبس إلى انتصارات صغيرة، اختيار ملابس مريحة، وطريقة ربط الحذاء التي تنجح.',summary_fr:"Découper l'habillage en petites victoires et une méthode de lacets qui marche.",why_en:'Dressing is five tasks pretending to be one. Backward chaining — you do the first steps, the child finishes — gives a feeling of success every single morning.',steps_en:'Lay clothes out in the order they go on.\nStart with the last step only: your child pulls the sock up the final inch.\nAdd one earlier step each week.\nRemove tags; turn seams out if they bother.\nFor laces, teach the "bunny ears" method on a shoe on the table first.',videoUrl:'',videoAsset:'',images:[],files:[],links:[],sources_en:''},
  {id:'noisy-places',published:true,order:3,color:'sky',kid:'s2_2',cat:'sensory',ages:'2–15',duration:'7 min',title_en:'Noisy places: preparing for outings',title_ar:'الأماكن الصاخبة: التحضير للخروج',title_fr:'Lieux bruyants : préparer les sorties',summary_en:'Reading early signs of overload, a quiet-break card, and how to plan a visit to a busy souk or family gathering.',summary_ar:'قراءة علامات الإرهاق الحسي المبكرة، بطاقة استراحة هادئة، والتخطيط لزيارة السوق أو العزومة.',summary_fr:'Repérer les premiers signes de surcharge et planifier une sortie.',why_en:'Overload builds quietly before it shows. A plan made at home — where to go for quiet, what to bring, when to leave — turns a feared outing into a practised one.',steps_en:'Tell your child where you are going using a photo.\nPack headphones, a fidget and a snack in a "calm bag".\nAgree on a quiet-break sign.\nArrive early, before the crowd.\nLeave on a good moment, not after a bad one.',videoUrl:'',videoAsset:'',images:[],files:[],links:[],sources_en:''}],

var SUPA_URL='https://mtrvcffjfngopllyuwis.supabase.co', SUPA_KEY='sb_publishable_I79I2MBcZ9hKpbkUJT1uSA_fkWFH5C4';
var supa=null;
function sbDocs(){
  function ref(coll,id){ return {
    get:async function(){ var r=await supa.from('docs').select('data').eq('coll',coll).eq('id',id).maybeSingle(); if(r.error) throw r.error; return {exists:!!r.data, data:function(){return r.data?r.data.data:null}} },
    set:async function(data){ var r=await supa.from('docs').upsert({coll:coll,id:id,data:data,updated_at:new Date().toISOString()}); if(r.error) throw r.error },
    delete:async function(){ var r=await supa.from('docs').delete().eq('coll',coll).eq('id',id); if(r.error) throw r.error }
  }}
  return {
    doc:function(path){ var p=path.split('/'); return ref(p[0],p[1]) },
    collection:function(coll){ return {
      doc:function(id){ return ref(coll,id) },
      get:async function(){ var r=await supa.from('docs').select('id,data').eq('coll',coll); if(r.error) throw r.error; return {docs:(r.data||[]).map(function(row){return {id:row.id,data:function(){return row.data}}})} }
    }}
  };
}
var sbAssets={ upload:async function(f){
  var name=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'-'+f.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-');
  var r=await supa.storage.from('media').upload(name,f,{contentType:f.type||undefined,upsert:false}); if(r.error) throw r.error;
  return {id:supa.storage.from('media').getPublicUrl(name).data.publicUrl} } };
async function sbCheckAdmin(){ var s=await supa.auth.getSession(); if(!s.data.session) return false; var r=await supa.rpc('is_admin'); return !r.error&&r.data===true }
async function adminLogin(email,pw){ var r=await supa.auth.signInWithPassword({email:email,password:pw}); if(r.error) throw r.error; isAdmin=await sbCheckAdmin(); if(!isAdmin){ await supa.auth.signOut(); throw new Error('This account is not an ACADI admin') } await initPlatform(true) }
async function adminLogout(){ if(supa) await supa.auth.signOut(); isAdmin=false; assets=null; S.applications=[]; S.suggestions=[]; renderNav(); location.hash='#home' }

async function initPlatform(force){
  if(location.protocol==='file:'&&/previewadmin/.test(location.search)){ isAdmin=true; renderNav(); if(route().page==='admin') render(); }
  var onClaude=!!(window.claude&&claude.use);
  if(!onClaude&&!(window.supabase&&window.supabase.createClient)) return;
  try{
    if(onClaude){ user=await claude.use('user'); isAdmin=!!(user&&user.canEdit&&user.canEdit()); db=await claude.use('db'); }
    else { if(!supa) supa=window.supabase.createClient(SUPA_URL,SUPA_KEY); db=sbDocs(); isAdmin=await sbCheckAdmin(); }
    if(db){
      live=true;
      var sd=await db.doc('content/settings').get().catch(function(){return null});
      if(sd&&sd.exists&&sd.data()){ var sdd=sd.data(); S.settings=Object.assign({},DEF.settings,sdd); S.settings.pages=Object.assign({},DEF.settings.pages,sdd.pages||{}); }
      for(var k of ['lessons','printables','articles','products','collaborators']){
        var snap=await db.collection(k).get().catch(function(){return null});
        if(snap&&snap.docs&&snap.docs.length) S[k]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
        else if(snap&&snap.docs) S[k]=(k==='products'||k==='collaborators')?[]:S[k];
      }
      if(isAdmin){
        for(var k2 of ['applications','suggestions']){ var sn=await db.collection(k2).get().catch(function(){return null}); if(sn&&sn.docs){ var out=[]; sn.docs.forEach(function(d){ var dd=d.data()||{}; (dd.items||[dd]).forEach(function(it,n){ out.push(Object.assign({id:d.id+':'+n,_doc:d.id,_n:n},it)) }) }); S[k2]=out } }
        assets=onClaude?await claude.use('assets'):sbAssets;
      }
      render();
    }
  }catch(e){ console.warn('platform',e) }
  renderNav();
}

/* ---------------- pricing ---------------- */
function money(v,cur){ v=Number(v); if(isNaN(v)) return ''; cur=cur||'USD'; var sym={USD:'$',CAD:'CA$',EUR:'€',LBP:'LBP '}[cur]||cur+' '; return cur==='LBP'?sym+Math.round(v).toLocaleString():sym+v.toFixed(2) }
function finalPrice(p){ var base=Number(p.price)||0, dv=Number(p.discountValue)||0; if(p.discountType==='percent') return Math.max(0,base*(1-dv/100)); if(p.discountType==='amount') return Math.max(0,base-dv); return base }
function marginText(p){ var fp=finalPrice(p), cost=Number(p.cost)||0; if(!p.price) return 'Enter a price to see the margin.'; var m=fp-cost, pct=fp?Math.round(m/fp*100):0; return 'Customer pays <b>'+money(fp,p.currency)+'</b>'+(p.discountType&&p.discountValue?' (was '+money(p.price,p.currency)+')':'')+(cost?' · margin <b>'+money(m,p.currency)+'</b> ('+pct+'%)':' · add your cost to see margin') }
function priceTag(p){ var fp=finalPrice(p); if(!p.price) return '<span class="dl">'+T('soon')+'</span>'; var h='<span class="price">'+money(fp,p.currency)+'</span>'; var was=(p.discountType&&p.discountValue)?Number(p.price):(Number(p.compareAt)||0); if(was&&was>fp) h+=' <s class="was">'+money(was,p.currency)+'</s>'; if(p.discountType==='percent'&&p.discountValue) h+=' <span class="off">-'+p.discountValue+'%</span>'; else if(p.discountType==='amount'&&p.discountValue) h+=' <span class="off">-'+money(p.discountValue,p.currency)+'</span>'; return h }

/* ---------------- HTML sanitiser (for admin-authored rich text) ---------------- */
function clean(html){ if(!html) return ''; var d=document.createElement('div'); d.innerHTML=html; var walk=function(n){ [].slice.call(n.children).forEach(function(c){ var tag=c.tagName.toLowerCase(); if(['script','iframe','object','embed','style','link','meta','form','input','button'].indexOf(tag)>-1){ c.remove(); return } [].slice.call(c.attributes).forEach(function(a){ var nm=a.name.toLowerCase(), v=String(a.value); if(nm.indexOf('on')===0||(nm==='href'||nm==='src')&&/^\s*javascript:/i.test(v)) c.removeAttribute(a.name); if(nm==='style'&&!/^[a-z\-]+:\s*[#\w\s,.%()'"-]+;?(\s*[a-z\-]+:\s*[#\w\s,.%()'"-]+;?)*$/i.test(v)) c.removeAttribute('style') }); if(tag==='a'){ c.setAttribute('rel','noopener'); if(!/^#/.test(c.getAttribute('href')||'')) c.setAttribute('target','_blank') } walk(c) }) }; walk(d); return d.innerHTML }
function isHtml(t){ return /<\w+[^>]*>/.test(t||'') }
function rich(t){ return isHtml(t)?clean(t):paras(t) }

function bindRte(root){
  $$('.rte',root).forEach(function(box){ if(box._b) return; box._b=1; var ed=$('.ed',box); var savedRange=null;
    ed.addEventListener('keyup',function(){ var s=getSelection(); if(s.rangeCount) savedRange=s.getRangeAt(0) }); ed.addEventListener('mouseup',function(){ var s=getSelection(); if(s.rangeCount) savedRange=s.getRangeAt(0) });
    function restore(){ ed.focus(); if(savedRange){ var s=getSelection(); s.removeAllRanges(); s.addRange(savedRange) } }
    $('.bar',box).addEventListener('mousedown',function(e){ if(e.target.tagName==='BUTTON') e.preventDefault() });
    $('.bar',box).addEventListener('click',async function(e){ var b=e.target.closest('button'); if(!b) return; var c=b.dataset.cmd; restore();

      document.execCommand(c,false,null) });

    $('[data-rte-vid]',box).addEventListener('change',async function(){ var f=this.files[0]; if(!f) return; if(!assets){ toast('Uploads unavailable'); return } toast('Uploading…'); try{ var r=await assets.upload(f); restore(); document.execCommand('insertHTML',false,'<video controls playsinline src="'+imgSrc(r.id)+'"></video><p></p>'); toast('Video inserted') }catch(err){ toast('Upload failed') } this.value='' });
  });
}

async function inboxWrite(coll,doc){ if(supa){ try{ var rid=Date.now()+'-'+Math.random().toString(36).slice(2,8); var ins=await supa.from('docs').insert({coll:coll,id:rid,data:{items:[doc],at:Date.now()}}); if(ins.error) throw ins.error; return true }catch(e){ console.warn('inbox',e); return false } } if(!db||!user||!user.id) return false; try{ var uid=await user.id(); var ref=db.collection(coll).doc(uid); var prev=await ref.get().catch(function(){return null}); var items=(prev&&prev.exists&&prev.data()&&prev.data().items)||[]; items.push(doc); await ref.set({items:items,at:Date.now()}); return true }catch(e){ console.warn('inbox',e); return false } }

/* ---------------- page motion ---------------- */
function motion(r){
  // grids: staggered children; singles: simple reveal
  var grids=['.grid3','.pgrid','.pgrid2','.hgrid','.agrid','.pillars','.pros','.lessons'];
  var done=new Set();
  grids.forEach(function(sel){ $$(sel).forEach(function(g){ var kids=[].slice.call(g.children).filter(function(k){return k.hasAttribute('data-reveal')||true}); if(!kids.length) return; kids.forEach(function(k){done.add(k)}); gsap.set(kids,{opacity:0,y:40}); gsap.to(kids,{opacity:1,y:0,duration:.9,ease:'power3.out',stagger:.08,scrollTrigger:{trigger:g,start:'top 85%'}}) }) });
  $$('[data-reveal]').forEach(function(el){ if(done.has(el)) return; gsap.to(el,{opacity:1,y:0,duration:.9,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 90%'}}) });
  // headings: slide up from a clipped line
  $$('section h2, .banner h1').forEach(function(h){ if(h.closest('.hero')) return; gsap.from(h,{y:30,opacity:0,duration:1,ease:'power4.out',scrollTrigger:{trigger:h,start:'top 92%'}}) });

  // mission image & support kid
  $$('.mission img').forEach(function(im){ gsap.from(im,{scale:.92,opacity:0,duration:1.2,ease:'expo.out',scrollTrigger:{trigger:im,start:'top 80%'}}) });
  var sk=$('.kidf img'); if(sk){ gsap.from(sk,{yPercent:20,opacity:0,duration:1,ease:'expo.out',scrollTrigger:{trigger:'.box2',start:'top 75%'}}); gsap.to(sk,{y:-6,duration:2.6,yoyo:true,repeat:-1,ease:'sine.inOut'}) }
  var big=$('.box2 .big'); if(big) gsap.to(big,{xPercent:-10,ease:'none',scrollTrigger:{trigger:'.box2',start:'top bottom',end:'bottom top',scrub:true}});
  // helps block: dark panel slides in
  var hp=$('.helps'); if(hp) gsap.from(hp,{y:60,opacity:0,borderRadius:'60px',duration:1,ease:'power3.out',scrollTrigger:{trigger:hp,start:'top 85%'}});
  // ticker
  var row=$('#ticker'); if(row){ row.innerHTML+=row.innerHTML; gsap.to(row,{xPercent:-50,duration:28,repeat:-1,ease:'none'}) }
  // magnetic buttons (desktop)
  if(matchMedia('(pointer:fine)').matches){ $$('.btn, .arrow').forEach(function(b){ b.addEventListener('pointermove',function(e){ var r=b.getBoundingClientRect(); gsap.to(b,{x:(e.clientX-r.left-r.width/2)*.18,y:(e.clientY-r.top-r.height/2)*.18,duration:.4,ease:'power2.out'}) }); b.addEventListener('pointerleave',function(){ gsap.to(b,{x:0,y:0,duration:.6,ease:'elastic.out(1,.5)'}) }) }) }
  ScrollTrigger.refresh();
}

  if(matchMedia('(pointer:fine)').matches) hero.addEventListener('pointermove',function(e){ var r=hero.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5; gsap.to(word,{x:dx*-30,y:dy*-14,duration:.8,ease:'power2.out'}); gsap.to([kidL,kidR],{x:dx*26,duration:.8,ease:'power2.out'}); gsap.to(kidM.firstElementChild,{rotation:dx*2,duration:.8,ease:'power2.out'}) });
  gsap.to(word,{yPercent:40,ease:'none',scrollTrigger:{trigger:hero,start:'top top',end:'bottom top',scrub:true}}); gsap.to('#cast',{yPercent:10,ease:'none',scrollTrigger:{trigger:hero,start:'top top',end:'bottom top',scrub:true}});
}

  P.welcome.pillars.forEach(function(pl,i){ html+='<div class="editor" data-pg="pillar'+i+'"><div class="col"><b>Welcome card '+(i+1)+'</b>'+lg3(function(l){return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+fld('Title ('+l+')','t_'+l,pl['t_'+l])+fld('Text ('+l+')','s_'+l,pl['s_'+l])+'</div>'})+'</div><div class="col"><div class="fld"><label>Icon (PNG, transparent)</label><label class="up">'+(assets?'Click to upload icon':'Uploads unavailable')+'<input type="file" accept="image/*" data-pgup="pillar'+i+'.icon"></label><div class="thumbs">'+(pl.icon?'<div class="ad-t"><img src="'+imgSrc(pl.icon)+'" alt=""><button data-pgrm="pillar'+i+'.icon">×</button></div>':'')+'</div></div></div></div>' });
  html+='<div class="editor" data-pg="about"><div class="col"><b>About ACADI page</b>'+lg3(function(l){return fld('Page title ('+l+')','title_'+l,P.about['title_'+l])+fld('Body ('+l+')','body_'+l,P.about['body_'+l],'rich')})+'</div><div class="col"><div class="fld"><label>Banner character</label><div class="kids" data-pick="aboutkid">'+KIDS.map(function(x){return '<img src="'+x+'.webp" data-kid="'+x+'" class="'+((P.about.kid||'s4_3')===x?'on':'')+'" alt="">'}).join('')+'</div></div><div class="fld"><label>Photos</label><label class="up">'+(assets?'Click to upload images':'Uploads unavailable')+'<input type="file" accept="image/*" multiple data-pgup="about.images"></label><div class="thumbs">'+(P.about.images||[]).map(function(im,n){return '<div class="ad-t"><img src="'+imgSrc(im)+'" alt=""><button data-pgrm="about.images:'+n+'">×</button></div>'}).join('')+'</div></div><div class="fld"><label>Video</label><label class="up">'+(assets?'Click to upload MP4':'Uploads unavailable')+'<input type="file" accept="video/*" data-pgup="about.videoAsset"></label>'+(P.about.videoAsset?'<div class="thumbs"><div class="ad-t"><video src="'+imgSrc(P.about.videoAsset)+'" muted></video><button data-pgrm="about.videoAsset">×</button></div></div>':'')+'</div>'+fld('Video link','about.videoUrl',P.about.videoUrl)+'</div></div>';
  html+='<div class="editor" data-pg="mission"><div class="col"><b>Mission & community block</b>'+lg3(function(l){return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+fld('Line 1 ('+l+')','h1_'+l,P.mission['h1_'+l])+fld('Big word ('+l+')','h2_'+l,P.mission['h2_'+l])+'</div>'+fld('Paragraph ('+l+')','p_'+l,P.mission['p_'+l],'area')})+'</div><div class="col"><div class="fld"><label>Photo (replaces the classroom illustration)</label><label class="up">'+(assets?'Click to upload image':'Uploads unavailable')+'<input type="file" accept="image/*" data-pgup="mission.images"></label><div class="thumbs">'+(P.mission.images||[]).map(function(im,n){return '<div class="ad-t"><img src="'+imgSrc(im)+'" alt=""><button data-pgrm="mission.images:'+n+'">×</button></div>'}).join('')+'</div></div></div></div>';
  html+='<div class="editor" data-pg="support"><div class="col"><b>Support ACADI block</b>'+lg3(function(l){return fld('Headline ('+l+')','h_'+l,P.support['h_'+l])+fld('Paragraph ('+l+')','p_'+l,P.support['p_'+l],'area')+fld('Small reassurance line ('+l+')','q_'+l,P.support['q_'+l])})+'</div><div class="col"><div class="notice">Donation links live under Settings & donations.</div></div></div>';
  return html+'</form>' }
function readPagesForm(){ var f=$('#ef'); if(!f) return; var P=S.settings.pages; $$('[data-pg]',f).forEach(function(box){ var key=box.dataset.pg; var target = /^pillar(\d)$/.test(key)?P.welcome.pillars[+key.slice(6)]:P[key]; var o={}; $$('input[name],textarea[name],select[name]',box).forEach(function(el){ o[el.name]=el.value }); $$('.rte .ed[data-name]',box).forEach(function(ed){ var h=ed.innerHTML.trim(); o[ed.dataset.name]=(h==='<br>'||h==='<p><br></p>')?'':h }); Object.keys(o).forEach(function(k){ var kk=k.indexOf('.')>-1?k.split('.')[1]:k; target[kk]=o[k] }); var kid=$('[data-pick="aboutkid"] img.on',box); if(kid) target.kid=kid.dataset.kid }) }

function inbox(k,fields){ var l=S[k].slice().sort(function(a,b){return (b.at||0)-(a.at||0)}); return '<div class="toolbar"><h2>'+(k==='applications'?'Collaboration requests':'Topic suggestions')+'</h2></div><div class="table"><div class="trow" style="grid-template-columns:1fr"><span>'+l.length+' total</span></div>'+(l.length?l.map(function(x){return '<div class="trow" style="grid-template-columns:1fr auto"><div>'+fields.map(function(f){return x[f]?'<div><b style="font-size:11px;text-transform:uppercase;color:var(--muted)">'+f+'</b> '+esc(x[f])+'</div>':''}).join('')+'<div style="font-size:12px;color:var(--muted)">'+(x.at?new Date(x.at).toLocaleString():'')+' · '+esc(x.lang||'')+'</div></div><div class="ops">'+(k==='applications'?'<button class="ibtn" data-act="approve" data-id="'+esc(x.id)+'">Add as collaborator</button>':'')+'<button class="ibtn red" data-act="del-inbox" data-k="'+k+'" data-id="'+esc(x.id)+'">Delete</button></div></div>'}).join(''):'<div class="trow" style="grid-template-columns:1fr;color:var(--muted)">Empty.</div>')+'</div>' }

async function saveDoc(coll,id,data){ if(!db) { toast('No database connection'); return false } try{ var copy=Object.assign({},data); delete copy.id; await db.collection(coll).doc(id).set(copy); return true }catch(e){ console.error(e); toast('Save failed: '+(e.message||e)); return false } }
async function delDoc(coll,id){ if(!db) return false; try{ await db.collection(coll).doc(id).delete(); return true }catch(e){ toast('Delete failed'); return false } }
function readForm(){ var f=$('#ef'); var o={}; $$('input[name],textarea[name],select[name]',f).forEach(function(el){ o[el.name]=el.value }); $$('.rte .ed[data-name]',f).forEach(function(ed){ var h=ed.innerHTML.trim(); o[ed.dataset.name]=(h==='<br>'||h==='<p></p>'||h==='<p><br></p>')?'':h }); return o }
function bindAdmin(){
  var root=$('.admin'); if(!root) return;
  root.addEventListener('click',async function(e){
    var b=e.target.closest('button,img[data-kid]'); if(!b) return;
    if(b.dataset.tab){ A.tab=b.dataset.tab; A.edit=null; render(); return }
    var act=b.dataset.act, k=A.tab;
    if(act==='new'){ A.edit='__new__'; A.draft={id:'',published:true,order:(S[k].length+1),images:[],files:[],links:[],color:'lavender',cat:Object.keys(CATS)[0],kid:'s6_3'}; A.editLang='en'; rerenderMain(); return }
    if(act==='edit'){ var x=S[k].filter(function(y){return y.id===b.dataset.id})[0]; A.edit=x.id; A.draft=JSON.parse(JSON.stringify(x)); A.draft.images=A.draft.images||[]; A.draft.files=A.draft.files||[]; A.draft.links=A.draft.links||[]; A.editLang='en'; rerenderMain(); return }
    if(act==='cancel'){ A.edit=null; A.draft=null; rerenderMain(); return }
    if(act==='toggle'){ var y=S[k].filter(function(z){return z.id===b.dataset.id})[0]; y.published=!(y.published!==false); if(await saveDoc(k,y.id,y)) toast('Saved'); rerenderMain(); return }
    if(act==='del'){ if(!confirm('Delete "'+b.dataset.id+'" permanently?')) return; if(await delDoc(k,b.dataset.id)){ S[k]=S[k].filter(function(z){return z.id!==b.dataset.id}); toast('Deleted') } rerenderMain(); return }
    if(act==='del-inbox'){ var kk=b.dataset.k; var it=S[kk].filter(function(z){return z.id===b.dataset.id})[0]; if(!it) return; try{ var ref=db.collection(kk).doc(it._doc); var cur=await ref.get(); var items=(cur.data()||{}).items||[]; items.splice(it._n,1); if(items.length) await ref.set({items:items,at:Date.now()}); else await ref.delete(); S[kk]=S[kk].filter(function(z){return z.id!==b.dataset.id}); toast('Deleted') }catch(err){ toast('Delete failed') } rerenderMain(); return }
    if(act==='approve'){ var ap=S.applications.filter(function(z){return z.id===b.dataset.id})[0]; var cid='c-'+(ap.name||'x').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); var cdoc={id:cid,published:false,order:S.collaborators.length+1,name:ap.name,role:ap.role,org:ap.org,city:ap.city,email:ap.email,summary_en:ap.about||'',images:[],files:[],links:[]}; if(await saveDoc('collaborators',cid,cdoc)){ S.collaborators.push(cdoc); toast('Added as draft collaborator — publish it from Collaborators') } rerenderMain(); return }
    if(act==='save'){ syncDraft(); var d=A.draft; d.id=(d.id||d.title_en||'item').toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g,'-').replace(/(^-|-$)/g,''); if(!d.id){ toast('ID required'); return } d.published=String(d.published)!=='false'; d.order=+d.order||99; d.links=(d.links||[]).filter(function(l){return l.u}); var oldId=A.edit; if(await saveDoc(k,d.id,d)){ if(oldId&&oldId!=='__new__'&&oldId!==d.id) await delDoc(k,oldId); S[k]=S[k].filter(function(z){return z.id!==d.id&&z.id!==oldId}); S[k].push(d); toast('Saved ✓'); A.edit=null; A.draft=null; rerenderMain() } return }
    if(act==='save-settings'){ if(A.tab==='pages') readPagesForm(); else readSettingsForm(); if(!db){toast('No database');return} try{ await db.doc('content/settings').set(S.settings); toast('Saved ✓') }catch(err){ toast('Save failed') } return }
    if(act==='slide-add'){ readSettingsForm(); S.settings.slides.push({word_en:'NEW',word_ar:'جديد',word_fr:'NOUVEAU',bg:'#E6DDF7',main:'s1_1',l:'s1_3',r:'s1_4',tab_en:'New'}); rerenderMain(); return }
    if(act==='slide-del'){ readSettingsForm(); S.settings.slides.splice(+b.dataset.i,1); rerenderMain(); return }
    if(b.dataset.ltTab){ syncDraft(); A.editLang=b.dataset.ltTab; rerenderMain(); return }
    if(b.dataset.pgrm){ readPagesForm(); var P=S.settings.pages; var q=b.dataset.pgrm.split(':'); var parts=q[0].split('.'); if(parts[0].indexOf('pillar')===0) P.welcome.pillars[+parts[0].slice(6)].icon=''; else if(q.length>1) P[parts[0]][parts[1]].splice(+q[1],1); else P[parts[0]][parts[1]]=''; rerenderMain(); return }
    if(b.dataset.rm){ syncDraft(); A.draft[b.dataset.rm]=''; rerenderMain(); return }
    if(b.dataset.rmi){ syncDraft(); var p=b.dataset.rmi.split(':'); A.draft[p[0]].splice(+p[1],1); rerenderMain(); return }
    if(b.dataset.rml!=null){ syncDraft(); A.draft.links.splice(+b.dataset.rml,1); rerenderMain(); return }
    if(b.dataset.kid!=null){ var wrap=b.closest('[data-pick],[data-kids]'); $$('img',wrap).forEach(function(i){i.classList.toggle('on',i===b)}); if(wrap.dataset.kids!=null){ syncDraft(); A.draft.kid=b.dataset.kid } return }
  });
  root.addEventListener('input',function(e){ if(!A.draft||A.tab!=='products') return; var m=$('[data-margin]',root); if(!m) return; var o=readForm(); m.innerHTML=marginText(o) });
  root.addEventListener('change',async function(e){
    var inp=e.target; if(inp.dataset.pgup){ if(!assets){ toast('Uploads unavailable'); return } readPagesForm(); var files=[].slice.call(inp.files||[]); if(!files.length) return; toast('Uploading…'); var P=S.settings.pages; var parts=inp.dataset.pgup.split('.'); for(var f of files){ try{ var r=await assets.upload(f); if(parts[0].indexOf('pillar')===0){ P.welcome.pillars[+parts[0].slice(6)].icon=r.id } else if(parts[1]==='images'){ P[parts[0]].images=P[parts[0]].images||[]; if(parts[0]==='mission') P[parts[0]].images=[r.id]; else P[parts[0]].images.push(r.id) } else { P[parts[0]][parts[1]]=r.id } }catch(err){ toast('Upload failed') } } toast('Uploaded — click Save all'); rerenderMain(); return }
    if(!inp.dataset.up) return; if(!assets){ toast('Uploads unavailable'); return } syncDraft(); var files=[].slice.call(inp.files||[]); if(!files.length) return; toast('Uploading…');
    for(var f of files){ try{ var r=await assets.upload(f); if(inp.dataset.up==='videoAsset') A.draft.videoAsset=r.id; else if(inp.dataset.up==='files') A.draft.files.push({id:r.id,name:f.name}); else A.draft.images.push(r.id) }catch(err){ toast('Upload failed: '+(err.message||err)) } }
    toast('Uploaded ✓'); rerenderMain();
  });
}
function syncDraft(){ var f=$('#ef'); if(!f||!A.draft) return; var o=readForm(); Object.keys(o).forEach(function(k){ A.draft[k]=o[k] }); var links=[]; $$('[data-links] .lk',f).forEach(function(row){ var t=$('[data-lt]',row).value, u=$('[data-lu]',row).value; if(t||u) links.push({t:t,u:u}) }); A.draft.links=links; var kid=$('[data-kids] img.on',f); if(kid) A.draft.kid=kid.dataset.kid }
function readSettingsForm(){ var f=$('#ef'); if(!f) return; if(A.tab==='hero'){ $$('[data-slide]',f).forEach(function(box,i){ var s=S.settings.slides[i]; $$('input[name],textarea[name]',box).forEach(function(el){ s[el.name]=el.value }); ['main','l','r'].forEach(function(p){ var on=$('[data-pick="'+p+'"] img.on',box); if(on) s[p]=on.dataset.kid }) }) }
  else if(A.tab==='helps'){ $$('[data-help]',f).forEach(function(box,i){ var h=S.settings.helps[i]; $$('input[name]',box).forEach(function(el){ h[el.name]=el.value }); var on=$('[data-pick] img.on',box); if(on) h.kid=on.dataset.kid }) }
  else { var o=readForm(); Object.keys(o).forEach(function(k){ S.settings[k]=o[k] }) } }
function rerenderMain(){ var m=$('#amain'); if(m){ m.innerHTML=adminMain(); bindRte(m) } var sideBtns=$$('.ad-side button'); sideBtns.forEach(function(b){ b.classList.toggle('on',b.dataset.tab===A.tab) }) }

/* ---------------- boot ---------------- */
document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
render(); initPlatform();
})();
</script>
